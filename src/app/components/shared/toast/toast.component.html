<div class="toast" [class]="toast().type" [style.borderLeftColor]="getColor()">
  <div class="toast-icon" [style.color]="getColor()">
    <i [class]="'fas ' + getIcon()"></i>
  </div>
  <div class="toast-content">
    <div class="toast-title">{{ toast().title }}</div>
    <div class="toast-message">{{ toast().message }}</div>
  </div>
  <button class="toast-close" (click)="close()">
    <i class="fas fa-times"></i>
  </button>
  <div class="toast-progress" [style.animationDuration]="(toast().duration || 3000) + 'ms'"></div>
</div>
